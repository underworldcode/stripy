[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    # Build against NumPy 2.x: the resulting binaries are compatible with
    # both NumPy 1.x and 2.x at runtime. Building against 1.x is NOT
    # forward-compatible with 2.x, which is the cause of gh-114.
    "numpy>=2.0.0",
]

[project]
name = "stripy"
version = "2.3.4"
description = "Python interface to TRIPACK and STRIPACK fortran code for triangulation/interpolation in Cartesian coordinates and on a sphere"
readme = "README.md"
authors = [
  {name = "Louis Moresi", email = "louis.moresi@anu.edu.au"},
  {name = "Ben Mather", email = "ben.mather@sydney.edu.au"},
]
maintainers = [
  {name = "Louis Moresi", email = "louis.moresi@anu.edu.au"},
  {name = "Ben Mather", email = "ben.mather@sydney.edu.au"},
]
license = { file = "COPYING.LESSER" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["triangulation", "sphere", "interpolation", "mesh"]
dependencies = [
    # Runtime requirement is intentionally looser than the build requirement:
    # wheels built against NumPy 2.x remain ABI-compatible with older NumPy
    # at runtime, back to the 2.0 backward-compat floor of 1.19.3 (see gh-114).
    "numpy>=1.19.3",
]

[project.optional-dependencies]
dev = ["pip-tools", "pytest", "scipy>=1.0.0"]

[project.urls]
Homepage = "https://github.com/underworldcode/stripy"
